<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinggis Beer | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:Inter,sans-serif;
background:#05070a;
color:white;
overflow-x:hidden;
}

.bg{
position:fixed;
inset:0;
z-index:-5;
overflow:hidden;
}

.light{
position:absolute;
width:700px;
height:700px;
border-radius:50%;
filter:blur(160px);
opacity:.35;
mix-blend-mode:screen;
animation:float 18s ease-in-out infinite alternate;
}

.light1{background:#4f7cff;top:-120px;left:-80px;}
.light2{background:#ff3c82;bottom:-160px;right:-120px;animation-duration:22s;}
.light3{background:#7c3aed;top:40%;left:55%;animation-duration:26s;opacity:.25;}

@keyframes float{
0%{transform:translate(0,0) scale(1);}
100%{transform:translate(60px,-40px) scale(1.2);}
}

.vignette{
position:fixed;
inset:0;
background:radial-gradient(circle at center, transparent 40%, rgba(0,0,0,.72) 100%);
z-index:-4;
}

.container{
width:1200px;
max-width:calc(100% - 40px);
margin:auto;
padding:60px 0 80px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

h1{
font-size:44px;
margin:0;
}

.back-link{
text-decoration:none;
color:#fff;
font-size:15px;
opacity:.8;
padding:12px 18px;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.03);
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:28px;
}

.project-card{
background:#0b1118;
border-radius:22px;
overflow:hidden;
border:1px solid rgba(255,255,255,.05);
cursor:pointer;
}

.project-thumb{
height:360px;
}

.project-thumb img{
width:100%;
height:100%;
object-fit:cover;
}

.project-info{
padding:20px;
}

/* lightbox */

.lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.lightbox.active{
display:flex;
}

.lightbox img{
max-width:90%;
max-height:90%;
}

.close{
position:absolute;
top:20px;
right:30px;
font-size:30px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="bg">
<div class="light light1"></div>
<div class="light light2"></div>
<div class="light light3"></div>
</div>

<div class="vignette"></div>

<div class="container">

<div class="top">
<h1>Chinggis Beer</h1>
<a href="index.html" class="back-link">← Back</a>
</div>

<div class="grid">

<div class="project-card" onclick="openLightbox('CB work1.jpg.jpg')">
<img src="CB work1.jpg.jpg">
</div>

<div class="project-card" onclick="openLightbox('CB work2.jpg.png')">
<img src="CB work2.jpg.png">
</div>

<div class="project-card" onclick="openLightbox('CB work3.jpg.png')">
<img src="CB work3.jpg.png">
</div>

<div class="project-card" onclick="openLightbox('CB work4.jpg.jpg')">
<img src="CB work4.jpg.jpg">
</div>

<div class="project-card" onclick="openLightbox('CB work5.jpg.jpg')">
<img src="CB work5.jpg.jpg">
</div>

<div class="project-card" onclick="openLightbox('CB work6.jpg.jpg')">
<img src="CB work6.jpg.jpg">
</div>

</div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<div class="close">×</div>
<img id="lightbox-img">
</div>

<script>
const lightbox=document.getElementById("lightbox");
const img=document.getElementById("lightbox-img");

function openLightbox(src){
img.src=src;
lightbox.classList.add("active");
}

function closeLightbox(){
lightbox.classList.remove("active");
}
</script>

</body>
</html>
