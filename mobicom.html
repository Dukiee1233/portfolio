<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobicom | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Inter,sans-serif;
background:#05070a;
color:white;
overflow-x:hidden;
}

.bg{
position:fixed;
inset:0;
z-index:-5;
overflow:hidden;
}

.light{
position:absolute;
width:700px;
height:700px;
border-radius:50%;
filter:blur(160px);
opacity:.35;
mix-blend-mode:screen;
animation:float 18s ease-in-out infinite alternate;
}

.light1{
background:#4f7cff;
top:-120px;
left:-80px;
}

.light2{
background:#ff3c82;
bottom:-160px;
right:-120px;
animation-duration:22s;
}

.light3{
background:#7c3aed;
top:40%;
left:55%;
animation-duration:26s;
opacity:.25;
}

@keyframes float{
0%{
transform:translate(0,0) scale(1);
}
100%{
transform:translate(60px,-40px) scale(1.2);
}
}

.vignette{
position:fixed;
inset:0;
background:radial-gradient(circle at center, transparent 40%, rgba(0,0,0,.72) 100%);
z-index:-4;
}

.container{
width:1200px;
max-width:calc(100% - 40px);
margin:auto;
padding:60px 0 80px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
margin-bottom:30px;
}

h1{
font-size:44px;
margin:0;
letter-spacing:-.02em;
}

.back-link{
text-decoration:none;
color:#fff;
font-size:15px;
opacity:.8;
padding:12px 18px;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.03);
transition:.25s ease;
}

.back-link:hover{
opacity:1;
transform:translateY(-2px);
border-color:rgba(255,255,255,.16);
background:rgba(255,255,255,.05);
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:28px;
}

.project-card{
background:#0b1118;
border-radius:22px;
overflow:hidden;
border:1px solid rgba(255,255,255,.05);
transition:.25s;
cursor:pointer;
}

.project-card:hover{
transform:translateY(-6px);
border-color:rgba(255,255,255,.15);
box-shadow:0 20px 45px rgba(0,0,0,.35);
}

.project-thumb{
height:360px;
overflow:hidden;
background:#111;
}

.project-thumb img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:.35s;
}

.project-card:hover img{
transform:scale(1.05);
}

.project-info{
padding:22px;
}

.project-info h3{
margin:0;
font-size:22px;
}

.project-info p{
margin:8px 0 0;
opacity:.6;
font-size:14px;
}

.lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,.86);
backdrop-filter:blur(18px);
display:none;
align-items:center;
justify-content:center;
z-index:999;
padding:30px;
}

.lightbox.active{
display:flex;
}

.lightbox img{
max-width:92vw;
max-height:88vh;
object-fit:contain;
border-radius:18px;
box-shadow:0 30px 90px rgba(0,0,0,.65);
}

.close{
position:fixed;
top:24px;
right:28px;
width:46px;
height:46px;
border-radius:50%;
border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.08);
color:white;
font-size:26px;
cursor:pointer;
display:grid;
place-items:center;
transition:.25s;
}

.close:hover{
background:rgba(255,255,255,.16);
transform:scale(1.05);
}

@media(max-width:1000px){
.grid{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:650px){
.top{
flex-direction:column;
align-items:flex-start;
}

h1{
font-size:34px;
}

.grid{
grid-template-columns:1fr;
}

.project-thumb{
height:300px;
}
}
</style>
</head>

<body>

<div class="bg">
<div class="light light1"></div>
<div class="light light2"></div>
<div class="light light3"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<button class="close" onclick="closeLightbox()">×</button>
<img id="lightbox-img" src="" alt="Preview">
</div>

<script>
const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightbox-img");

function openLightbox(src){
lightboxImg.src=src;
lightbox.classList.add("active");
}

function closeLightbox(){
lightbox.classList.remove("active");
lightboxImg.src="";
}

document.addEventListener("keydown",function(e){
if(e.key==="Escape"){
closeLightbox();
}
});
</script>
