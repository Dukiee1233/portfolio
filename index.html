<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Inter,sans-serif;
background:#05070a;
color:white;
overflow-x:hidden;
}

/* background */

.bg{
position:fixed;
inset:0;
z-index:-5;
overflow:hidden;
}

.light{
position:absolute;
width:700px;
height:700px;
border-radius:50%;
filter:blur(160px);
opacity:.35;
mix-blend-mode:screen;
animation:float 18s ease-in-out infinite alternate;
}

.light1{
background:#4f7cff;
top:-120px;
left:-80px;
}

.light2{
background:#ff3c82;
bottom:-160px;
right:-120px;
animation-duration:22s;
}

.light3{
background:#7c3aed;
top:40%;
left:55%;
animation-duration:26s;
opacity:.25;
}

@keyframes float{
0%{
transform:translate(0,0) scale(1);
}

100%{
transform:translate(60px,-40px) scale(1.2);
}
}

.vignette{
position:fixed;
inset:0;
background:radial-gradient(circle at center, transparent 40%, rgba(0,0,0,.72) 100%);
z-index:-4;
}

/* cursor glow */

.cursor-glow{
position:fixed;
width:360px;
height:360px;
border-radius:50%;
background:radial-gradient(circle, rgba(100,140,255,.18), rgba(100,140,255,0) 70%);
pointer-events:none;
z-index:-2;
mix-blend-mode:screen;
transition:transform .07s linear;
}

/* layout */

.container{
width:1280px;
max-width:calc(100% - 40px);
margin:auto;
padding:60px 0 80px;
}

h1{
font-size:44px;
margin:0 0 30px;
letter-spacing:-.02em;
}

/* grid */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:28px;
}

/* card */

.project-card{
background:#0b1118;
border-radius:22px;
overflow:hidden;
border:1px solid rgba(255,255,255,.05);
transition:.25s;
text-decoration:none;
color:white;
display:block;
}

.project-card:hover{
transform:translateY(-6px);
border-color:rgba(255,255,255,.15);
box-shadow:0 20px 45px rgba(0,0,0,.35);
}

/* thumbnail */

.project-thumb{
height:320px;
overflow:hidden;
background:#111;
}

.project-thumb img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:.35s;
}

.project-card:hover img{
transform:scale(1.05);
}

/* text */

.project-info{
padding:22px;
}

.project-info h3{
margin:0;
font-size:24px;
line-height:1.2;
}

.project-info p{
margin:8px 0 0;
opacity:.62;
font-size:15px;
}

/* responsive */

@media(max-width:1100px){
.grid{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:700px){
.container{
max-width:calc(100% - 24px);
padding:40px 0 60px;
}

h1{
font-size:34px;
}

.grid{
grid-template-columns:1fr;
}

.project-thumb{
height:260px;
}
}
</style>
</head>

<body>

<div class="bg">
<div class="light light1"></div>
<div class="light light2"></div>
<div class="light light3"></div>
</div>

<div class="vignette"></div>
<div class="cursor-glow"></div>

<div class="container">

<h1>Selected Projects</h1>

<div class="grid">

<!-- ASAHI -->
<a href="asahi.html" class="project-card">
<div class="project-thumb">
<img src="work1.jpg.png" alt="Asahi">
</div>
<div class="project-info">
<h3>Asahi</h3>
<p>POSM Campaign Series</p>
</div>
</a>

<!-- CHINGGIS BEER -->
<a href="chinggis.html" class="project-card">
<div class="project-thumb">
<img src="CB work1.jpg.jpg" alt="Chinggis Beer">
</div>
<div class="project-info">
<h3>Chinggis Beer</h3>
<p>Campaign Design Series</p>
</div>
</a>

<!-- MOBICOM -->
<a href="mobicom.html" class="project-card">
<div class="project-thumb">
<img src="mb1.jpg.jpeg" alt="Mobicom">
</div>
<div class="project-info">
<h3>Mobicom</h3>
<p>Social Campaign Series</p>
</div>
</a>

<!-- KOZEL -->
<a href="kozel.html" class="project-card">
<div class="project-thumb">
<img src="kozel-1.jpg.png" alt="Kozel">
</div>
<div class="project-info">
<h3>Kozel</h3>
<p>Beer Campaign Series</p>
</div>
</a>

<!-- VIDEO -->
<a href="video.html" class="project-card">
<div class="project-thumb">
<img src="video-cover.jpg" alt="Video">
</div>
<div class="project-info">
<h3>Video</h3>
<p>Reel / Motion</p>
</div>
</a>

</div>

</div>

<script>
const glow=document.querySelector(".cursor-glow");

document.addEventListener("mousemove",(e)=>{
glow.style.transform=`translate(${e.clientX-180}px,${e.clientY-180}px)`;
});
</script>

</body>
</html>
